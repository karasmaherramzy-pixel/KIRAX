<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIRAX - بوابة الأكواد السايبرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- الخلفية المتحركة -->
    <div class="background"></div>

    <!-- الشريط المتحرك -->
    <div class="marquee-container">
        <div class="marquee">
            <span class="neon-text">Neon Glow: 📺 YouTube 🔴 | 🤖 Roblox | 💻 أكواد برمجة</span>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="container">
        <!-- المربع المركزي -->
        <div class="main-box">
            <h1 class="title">الخطوة 1 و 2</h1>
            
            <div class="steps-container">
                <button class="step-btn youtube-btn" id="youtubeBtn">
                    <span>يوتيوب</span>
                    <i class="fab fa-youtube"></i>
                </button>
                
                <button class="step-btn discord-btn" id="discordBtn">
                    <span>ديسكورد</span>
                    <i class="fab fa-discord"></i>
                </button>
            </div>

            <!-- القفل -->
            <div class="lock-container">
                <div class="lock-btn locked" id="lockBtn">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="lock-text" id="lockText">أنجز الخطوتين أعلاه لفتح القفل</div>
            </div>
        </div>

        <!-- عملية التخطي -->
        <div class="skip-container" id="skipContainer">
            <h2 class="skip-title">جاري التخطي...</h2>
            <div class="skip-timer" id="skipTimer">01:00</div>
            <p class="skip-text">يجب الانتظار 60 ثانية قبل عرض مفتاح اليوم</p>
        </div>

        <!-- مربع مفتاح اليوم -->
        <div class="code-container" id="codeContainer">
            <h2 class="code-title">مفتاح اليوم</h2>
            <div class="code-box" id="codeDisplay"></div>
            <button class="copy-btn" id="copyBtn">
                <i class="fas fa-copy"></i> نسخ المفتاح
            </button>
            <p class="hint">المفتاح صالح فقط ليوم اليوم</p>
        </div>

        <div class="footer">
            تم التطوير بواسطة KIRAX - جميع الحقوق محفوظة © 2023
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
